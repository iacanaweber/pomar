<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Pomar: copa de árvore com uma seta ascendente recortada">
  <!-- Variação A: copa em círculo sólido sobre tronco curto e grosso, com a seta
       ascendente RECORTADA da copa. O recorte lê como movimento sem virar gráfico de
       corretora: não há eixo, não há série, é só a direção.

       Geometria por máscara e primitivas, nunca por arco quase-completo: o truque do
       "círculo em um arco só" é ambíguo entre renderizadores, e um ícone precisa sair
       idêntico em todos.
       Cores lidas de frontend/src/index.css: green=#1b5e20 sobre bg=#f6f8f6. -->
  <defs>
    <mask id="copa-seta">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="200" r="164" fill="#fff"/>
      <!-- a seta é um traço PRETO na máscara: o que é preto vira furo na copa -->
      <polyline points="170,240 256,154 342,240" fill="none" stroke="#000"
                stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#f6f8f6"/>
  <!-- tronco: CURTO E GROSSO. A primeira versão usava 52px de largura e sumia como um
       palito a 48px; 76px é o mínimo que ainda lê como tronco na tela inicial. -->
  <rect x="218" y="330" width="76" height="122" rx="24" fill="#1b5e20"/>
  <rect width="512" height="512" fill="#1b5e20" mask="url(#copa-seta)"/>
</svg>
