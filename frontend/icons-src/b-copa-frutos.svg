<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Pomar: copa de árvore com três frutos em progressão de tamanho">
  <!-- Variação B: mesma copa e mesmo tronco da A, mas o recorte são TRÊS FRUTOS em
       progressão de tamanho, subindo da esquerda para a direita. O crescimento vira
       repetição em vez de seta — mais perto de "pomar" e mais longe de gráfico.

       Os raios (26/36/46) são maiores que os do primeiro rascunho: com 22px o menor fruto
       virava um respingo a 48px e a progressão deixava de ser legível.
       Cores lidas de frontend/src/index.css: green=#1b5e20 sobre bg=#f6f8f6. -->
  <defs>
    <mask id="copa-frutos">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="200" r="164" fill="#fff"/>
      <circle cx="176" cy="262" r="26" fill="#000"/>
      <circle cx="256" cy="216" r="36" fill="#000"/>
      <circle cx="342" cy="162" r="46" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#f6f8f6"/>
  <!-- tronco: CURTO E GROSSO. A primeira versão usava 52px de largura e sumia como um
       palito a 48px; 76px é o mínimo que ainda lê como tronco na tela inicial. -->
  <rect x="218" y="330" width="76" height="122" rx="24" fill="#1b5e20"/>
  <rect width="512" height="512" fill="#1b5e20" mask="url(#copa-frutos)"/>
</svg>
