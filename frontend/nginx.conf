server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas de API para o backend (nome do serviço no docker-compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # O service worker NUNCA pode ser cacheado: ele é quem controla o cache de todo o
    # resto, e um sw.js velho preso no navegador congela a versão do app para sempre —
    # o fluxo de atualização deixa de rodar porque o arquivo que o dispara não muda.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # O manifest muda pouco, mas mudar o nome/ícone e ficar preso por um ano é pior que
    # revalidar de vez em quando.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Assets com hash no nome: o hash já é a versão, então cache longo é seguro.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fontes: o nome carrega a versão à mão (…-v1.woff2) e faz o papel do hash de
    # /assets/. Trocar a fonte exige trocar o nome — é o que torna `immutable` honesto.
    # `gzip off` porque woff2 já é comprimido por dentro: recomprimir gasta CPU e ADICIONA
    # bytes.
    location /fonts/ {
        types { font/woff2 woff2; }
        default_type font/woff2;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip off;
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
